<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Таймеры</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">

  <!-- Login screen -->
  <section id="auth-screen" class="screen">
    <div class="card">
      <h1>Таймеры</h1>
      <div id="auth-error" class="error hidden"></div>

      <form id="login-form">
        <label>Пароль
          <input type="password" id="login-password" autocomplete="current-password" required autofocus />
        </label>
        <button type="submit">Войти</button>
      </form>
      <p class="hint">Роль определяется автоматически по введённому паролю. Пароли задаются в Cloudflare (Secrets) при первом деплое, дальше их может менять администратор в разделе «Пароли».</p>
    </div>
  </section>

  <!-- Main app -->
  <section id="main-screen" class="screen hidden">
    <header>
      <h1>Таймеры</h1>
      <div class="header-actions">
        <span id="whoami"></span>
        <button id="admin-btn" class="secondary hidden">Пароли</button>
        <button id="logout-btn" class="secondary">Выйти</button>
      </div>
    </header>

    <div id="timers-grid" class="timers-grid"></div>

    <button id="add-timer-btn" class="fab hidden">+ Новый таймер</button>
  </section>

  <!-- Timer create/edit modal -->
  <div id="timer-modal" class="modal hidden">
    <div class="modal-card">
      <h2 id="timer-modal-title">Новый таймер</h2>
      <form id="timer-form">
        <input type="hidden" id="timer-id" />
        <label>Название
          <input type="text" id="timer-title" required />
        </label>
        <label>Описание (что отсчитываем)
          <textarea id="timer-description" rows="2"></textarea>
        </label>
        <label>Дата и время окончания
          <input type="datetime-local" id="timer-target" required />
        </label>
        <div class="modal-actions">
          <button type="button" id="timer-delete" class="danger hidden">Удалить</button>
          <button type="button" id="timer-cancel" class="secondary">Отмена</button>
          <button type="submit">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Admin: password management modal -->
  <div id="admin-modal" class="modal hidden">
    <div class="modal-card">
      <h2>Пароли ролей</h2>
      <p class="hint">Смена пароля разлогинит всех, кто сейчас вошёл под этой ролью.</p>
      <div id="roles-list"></div>
      <div class="modal-actions">
        <button type="button" id="admin-close" class="secondary">Закрыть</button>
      </div>
    </div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
