<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Мои таймеры</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">

  <!-- Login screen -->
  <section id="auth-screen" class="screen">
    <div class="card">
      <h1>Мои таймеры</h1>
      <div id="auth-error" class="error hidden"></div>
      <form id="login-form">
        <label>Пароль
          <input type="password" id="login-password" autocomplete="current-password" required autofocus />
        </label>
        <button type="submit">Войти</button>
      </form>
      <p class="hint">Роль определяется автоматически по паролю.</p>
    </div>
  </section>

  <!-- Main app -->
  <section id="main-screen" class="screen hidden">
    <header>
      <h1>Мои таймеры</h1>
      <div class="header-actions">
        <span id="whoami"></span>
        <button id="admin-btn" class="secondary hidden">Настройки</button>
        <button id="theme-btn" class="icon-btn" title="Тема">☀️</button>
        <div class="lang-wrap">
          <button id="lang-btn" class="icon-btn" title="Язык">🌐</button>
          <div id="lang-popup" class="popup hidden">В разработке</div>
        </div>
        <button id="logout-btn" class="secondary">Выйти</button>
      </div>
    </header>

    <div id="timers-grid" class="timers-grid"></div>
  </section>

  <!-- Admin: settings (role passwords) -->
  <div id="admin-modal" class="modal hidden">
    <div class="modal-card">
      <h2>Настройки</h2>
      <h3>Пароли ролей</h3>
      <p class="hint">Смена пароля разлогинит всех, кто сейчас вошёл под этой ролью.</p>
      <div id="roles-list"></div>
      <div class="modal-actions">
        <button type="button" id="admin-close" class="secondary">Закрыть</button>
      </div>
    </div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
