<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Таймеры</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">

  <!-- Login / first-time setup screen -->
  <section id="auth-screen" class="screen">
    <div class="card">
      <h1>Таймеры</h1>
      <div id="auth-error" class="error hidden"></div>

      <form id="login-form">
        <label>Логин
          <input type="text" id="login-username" autocomplete="username" required />
        </label>
        <label>Пароль
          <input type="password" id="login-password" autocomplete="current-password" required />
        </label>
        <button type="submit">Войти</button>
      </form>

      <p class="hint">Нет аккаунта администратора? <a href="#" id="show-setup">Создать первого администратора</a></p>

      <form id="setup-form" class="hidden">
        <h2>Создание администратора</h2>
        <p class="hint">Доступно только пока в базе нет ни одного пользователя.</p>
        <label>Логин
          <input type="text" id="setup-username" required />
        </label>
        <label>Пароль
          <input type="password" id="setup-password" required />
        </label>
        <button type="submit">Создать администратора</button>
        <a href="#" id="show-login">← Назад ко входу</a>
      </form>
    </div>
  </section>

  <!-- Main app -->
  <section id="main-screen" class="screen hidden">
    <header>
      <h1>Таймеры</h1>
      <div class="header-actions">
        <span id="whoami"></span>
        <button id="admin-btn" class="secondary hidden">Пользователи</button>
        <button id="logout-btn" class="secondary">Выйти</button>
      </div>
    </header>

    <div id="timers-grid" class="timers-grid"></div>

    <button id="add-timer-btn" class="fab">+ Новый таймер</button>
  </section>

  <!-- Timer create/edit modal -->
  <div id="timer-modal" class="modal hidden">
    <div class="modal-card">
      <h2 id="timer-modal-title">Новый таймер</h2>
      <form id="timer-form">
        <input type="hidden" id="timer-id" />
        <label>Название
          <input type="text" id="timer-title" required />
        </label>
        <label>Описание (что отсчитываем)
          <textarea id="timer-description" rows="2"></textarea>
        </label>
        <label>Дата и время окончания
          <input type="datetime-local" id="timer-target" required />
        </label>
        <div class="modal-actions">
          <button type="button" id="timer-delete" class="danger hidden">Удалить</button>
          <button type="button" id="timer-cancel" class="secondary">Отмена</button>
          <button type="submit">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Admin: user management modal -->
  <div id="admin-modal" class="modal hidden">
    <div class="modal-card">
      <h2>Пользователи</h2>
      <div id="users-list"></div>
      <hr />
      <h3>Добавить пользователя</h3>
      <form id="user-form">
        <label>Логин
          <input type="text" id="new-username" required />
        </label>
        <label>Пароль
          <input type="password" id="new-password" required />
        </label>
        <label>Роль
          <select id="new-role">
            <option value="user">Пользователь</option>
            <option value="admin">Администратор</option>
          </select>
        </label>
        <div class="modal-actions">
          <button type="button" id="admin-close" class="secondary">Закрыть</button>
          <button type="submit">Добавить</button>
        </div>
      </form>
    </div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
